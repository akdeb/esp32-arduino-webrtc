[platformio]
src_dir = examples/BrowserAudio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = ESP32-Arduino-WebRTC=symlink://.
build_flags = -DCORE_DEBUG_LEVEL=1
; Wi-Fi and OpenAI settings come from .env (see .env.example) or the environment.
extra_scripts = pre:tools/secrets.py

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv

[env:esp32]
board = esp32dev
board_build.partitions = huge_app.csv

[env:esp32s3_16k]
extends = env:esp32s3
build_flags = ${env.build_flags} -DWEBRTC_SAMPLE_RATE=16000

[env:esp32s3_48k]
extends = env:esp32s3
build_flags = ${env.build_flags} -DWEBRTC_SAMPLE_RATE=48000

[env:esp32s3_g711]
extends = env:esp32s3
build_flags = ${env.build_flags} -DWEBRTC_SAMPLE_RATE=8000 -DWEBRTC_USE_G711=1

; Elato board: speaker BCLK/WS/DOUT 6/5/7, mic SCK/WS/SD 1/4/14 on a separate bus,
; MAX98357 SD (enable) on 10. The board hosts Wi-Fi "esp32-webrtc" at 192.168.4.1.
[env:esp32s3_elato]
extends = env:esp32s3
build_flags = ${env.build_flags} -DWEBRTC_SOFTAP=1 -DWEBRTC_PINS=6,5,14,7 -DWEBRTC_MIC_CLOCK_PINS=1,4 -DWEBRTC_AMP_ENABLE_PIN=10

; Elato board joining an existing network (e.g. a phone hotspot) for internet peers such as
; OpenAI GPT-Live. Set WIFI_SSID and WIFI_PASSWORD in .env.
[env:esp32s3_elato_sta]
extends = env:esp32s3
build_flags = ${env.build_flags} -DWEBRTC_PINS=6,5,14,7 -DWEBRTC_MIC_CLOCK_PINS=1,4 -DWEBRTC_AMP_ENABLE_PIN=10

; examples/GPTLive on the Elato board, with .env filled in:
;   PLATFORMIO_SRC_DIR=examples/GPTLive pio run -e esp32s3_elato_gptlive -t upload
[env:esp32s3_elato_gptlive]
extends = env:esp32s3_elato_sta
